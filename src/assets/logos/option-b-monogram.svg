<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="YourPets">
  <title>YourPets — YP monogram ring</title>
  <!-- Ring uses currentColor, so it flips with the theme when inlined.
       The green paw stays constant as the brand accent. -->
  <circle cx="20" cy="20" r="17.4" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".9"/>
  <!-- Y -->
  <path d="M11.4 13.2 15.2 19v7.8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M19 13.2 15.2 19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- P with a paw-pad bowl -->
  <path d="M22.6 26.8V13.2h3.6a4.2 4.2 0 0 1 0 8.4h-3.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Green paw accent -->
  <g fill="#458500">
    <circle cx="27.7" cy="30.4" r="1.5"/>
    <circle cx="31.1" cy="29.1" r="1.5"/>
    <circle cx="24.4" cy="29.4" r="1.4"/>
    <path d="M27.9 32.2c1.9 0 3.4 1.1 3.4 2.5 0 1.1-1 1.7-2.2 1.7-.5 0-.8-.2-1.2-.2s-.6.2-1.2.2c-1.2 0-2.2-.6-2.2-1.7 0-1.4 1.5-2.5 3.4-2.5Z"/>
  </g>
</svg>
