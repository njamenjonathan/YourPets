      <stop stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <use href="#a-tag" fill="#458500"/>
  <use href="#a-tag" fill="url(#a-sheen)"/>
